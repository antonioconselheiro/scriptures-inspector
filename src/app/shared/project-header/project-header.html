<header class="tools">
  <div class="buttonGroup">
    <img class="logo" src="script.png" />
    <button class="save" [class.pulse]="saveIsAnimating" type="button" (click)="save()"></button>
  </div>
  <div class="zoomButtonGroup">
    <button type="button" (click)="zoomIn()">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
        <path d="M7 10l6 0" />
        <path d="M10 7l0 6" />
        <path d="M21 21l-6 -6" />
      </svg>
    </button>
    <button type="button" (click)="resetZoom()">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M8 11a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" />
        <path d="M16 16l-2.5 -2.5" />
        <path d="M3 7v-2a2 2 0 0 1 2 -2h2" />
        <path d="M3 17v2a2 2 0 0 0 2 2h2" />
        <path d="M17 3h2a2 2 0 0 1 2 2v2" />
        <path d="M17 21h2a2 2 0 0 0 2 -2v-2" />
      </svg>
    </button>
    <button type="button" (click)="zoomOut()">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
        <path d="M7 10l6 0" />
        <path d="M21 21l-6 -6" />
      </svg>
    </button>
  </div>
  <form>
    <fieldset>
      <legend>Artifacts Management</legend>

      <div>
        <button (click)="addArtifactCollection()" type="button">Add collection</button>
        <hr />
        <button (click)="addArtifacts()" type="button">Add artifacts</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Navigation</legend>

      <div>
        <select name="selectedBook" [(ngModel)]="formSelectedCollectionOrBook">
          @if (context === 'translator') {
            <ng-container *ngTemplateOutlet="booksTemplate"></ng-container>
            <ng-container *ngTemplateOutlet="collectionsTemplate"></ng-container>
          } @else if (context === 'transcriptor') {
            <ng-container *ngTemplateOutlet="collectionsTemplate"></ng-container>
            <ng-container *ngTemplateOutlet="booksTemplate"></ng-container>
          }
        </select>
  
        <input name="selectedChapter" class="selectedChapter" [(ngModel)]="formSelectedArtifactOrChapter" type="number" />
      </div>
      
      <div>
        <button type="button" (click)="open()">Go</button>
        <button type="button" [attr.disabled]="formSelectedArtifactOrChapter === 0 ? 'disabled': null"
          (click)="back()">Back</button>
        <button type="button" (click)="next()">Next</button>
      </div>
    </fieldset>

    <ng-content></ng-content>

    <div class="sidebuttons">
      <button (click)="minimized = !minimized" class="minimize" type="button">▲</button>
    </div>
  </form>
</header>


<ng-template #booksTemplate>
  @let bookNames = listBookNames();
  @if (bookNames.length) {
    <optgroup label="Books">
      @for (book of bookNames; track $index) {
        <option [value]="'book-'+book.key">{{ book.name }}</option>
      }
    </optgroup>
  }
</ng-template>

<ng-template #collectionsTemplate>
  @if (collections.length) {
    <optgroup label="Artifact Collections">
      @for (collection of collections; track $index) {
        <option [value]="'collection-'+collection.folder">{{ collection.name }}</option>
      }
    </optgroup>
  }
</ng-template>
