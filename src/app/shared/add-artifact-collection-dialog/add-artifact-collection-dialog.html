<form>

  @if (project && collections.length) {
    <table border="1" frame="hsides" role="presentation">
      <tr>
        <th>Collection Name</th>
        <th></th>
      </tr>
  
      @for (collection of collections; track $index) {
        <tr>
          <td [title]="collection.folder">{{ collection.name }}</td>
          <td><button type="button" [disabled]="saving || creating" (click)="editCollection(collection)"
            [attr.aria-label]="'Edit collection ' + collection.name">Edit</button>
            <button type="button" [disabled]="saving || creating" [attr.aria-label]="'Delete collection ' + collection.name"
            (click)="deleteCollection(project, collection.folder)">×</button></td>
        </tr>
      }
    </table>
  }

  <fieldset>
    <legend>{{ editingFolder ? 'Edit artifact collection' : 'Project Artifact Collections' }}</legend>

    <div>
      <label for="projectCreateArtifactCollections">Collection name</label>
      <input
        name="collectionName"
        type="text"
        id="projectCreateArtifactCollections"
        placeholder="Collection name"
        [(ngModel)]="collectionName"
        [disabled]="saving || creating"
      />
    </div>

    <div>
      <label for="projectCreateArtifactCollectionFolder">Folder name</label>
      <input
        type="text"
        name="folderName"
        id="projectCreateArtifactCollectionFolder"
        aria-readonly="true"
        readonly
        placeholder="Folder name"
        [value]="editingFolder ?? derivateFolderName(collectionName)"
      />
    </div>

    <div>
      <label for="projectCreateArtifactCollectionsDescription">Collection description</label>
      <textarea
        id="projectCreateArtifactCollectionsDescription"
        name="collectionDescription"
        placeholder="Collection description"
        [(ngModel)]="collectionDescription"
        [disabled]="saving || creating"
      ></textarea>
    </div>

    <div>
      <label for="projectCreateArtifactCollectionSources">References (one per line)</label>
      <textarea id="projectCreateArtifactCollectionSources" name="collectionSources" [(ngModel)]="collectionSources"
        [disabled]="saving || creating"
        placeholder="Links or bibliographic references"></textarea>
    </div>

    <div class="dialogActions">
      @if (editingFolder) {
        <button type="button" [disabled]="saving" (click)="cancelEdit()">Cancel</button>
        <button type="button" [disabled]="saving" (click)="saveCollection()">Save</button>
      } @else {
        <button type="button" [disabled]="creating" (click)="createCollection()">Create</button>
      }
    </div>
  </fieldset>
</form>
