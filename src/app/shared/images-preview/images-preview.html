@if (fromFiles && fromFiles.length) {
  <div class="previewNavigation">
    <div class="navigationButton" (click)="previous()">
      <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M15 6l-6 6l6 6" />
      </svg>
    </div>
    <input #imageIndexEl type="number" [(ngModel)]="imageIndex" (change)="imageIndex = imageIndexEl.value" />
    <div class="navigationButton" (click)="next()">
      <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M9 6l6 6l-6 6" />
      </svg>
    </div>
  </div>
}
<div class="currentPreview">
  <img [src]="getFileByIndex(imageIndex)" />
</div>
