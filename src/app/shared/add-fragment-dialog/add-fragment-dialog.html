<form>
  <fieldset>
    <legend>Project Fragment Collections</legend>

    <ul>
      @for (collection of collections; track $index) {
        <li>{{ collection.name }}</li>
      }
    </ul>

    <div>
      <label for="projectCreateFragmentCollections">Create Fragment Collection</label>
      <input
        #fragmentCollectionName
        name="collectionName"
        type="text"
        id="projectCreateFragmentCollections"
        placeholder="Collection name"
      />
    </div>

    <div>
      <label>Folder name</label>
      <input
        type="text"
        name="folderName"
        readonly
        placeholder="Folder name"
        [ngModel]="derivateFolderName(fragmentCollectionName.value)"
      />
    </div>

    <div>
      <label>Collection description</label>
      <textarea
        #collectionDescription
        name="collectionDescription"
        placeholder="Collection description"
      ></textarea>
    </div>

    <button type="button" (click)="createCollection(fragmentCollectionName, collectionDescription)">Create</button>
  </fieldset>

  <fieldset>
    <legend>Add Fragment</legend>
  
    <div>
      <label for="addFragmentFragmentName">Fragment Name</label>
      <input name="fragmentName" id="addFragmentFragmentName" type="text" />
    </div>

    <div>
      <label for="relatesFragmentToCollection">Collection</label>
      <select required id="relatesFragmentToCollection">
        <option></option>
      </select>
    </div>
  
    <div class="fragmentPreview"></div>
  </fieldset>

  <button type="submit">Save</button>
</form>
