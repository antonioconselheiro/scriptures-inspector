<form>
  <fieldset>
    <legend>Add Artifacts</legend>
  
    <div>
      <label for="relatesArtifactToCollection">Collection</label>
      <select #collectionFolder required id="relatesArtifactToCollection">
        @for (collection of collections; track $index) {
          <option [value]="collection.folder">{{collection.name}} ({{collection.folder}})</option>
        }
      </select>
    </div>

    <app-images-preview [fromFiles]="fromFiles"></app-images-preview>

    <div class="tableContainer">
      <table>
  
        <thead>
          <tr>
            <th></th>
            <th>File</th>
          </tr>
        </thead>
  
        <tbody
          cdkDropList
          [cdkDropListData]="fromFiles"
          (cdkDropListDropped)="drop($event)">
  
          @for (file of fromFiles; track $index) {
            <tr cdkDrag>
              <td cdkDragHandle>☰</td>
              <td>{{ file | fileName }}</td>
            </tr>
          }
  
        </tbody>
  
      </table>
    </div>

  </fieldset>

  <button type="button" (click)="importArtifacts(collectionFolder.value)">Import</button>
</form>
