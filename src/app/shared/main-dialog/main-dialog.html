<section #dialogPanel [class.hidden]="isClosed" [class.dragged]="dialogPosition" class="modal"
  [style.left.px]="dialogPosition?.left" [style.top.px]="dialogPosition?.top">
  <header (pointerdown)="startDragging($event)">
    <h1>{{title}}</h1>
    <button tabindex="1" aria-label="Close dialog" (click)="close()" type="button">
      x
    </button>
  </header>
  <div>
    <modal-outlet
      name="main"
      (closed)="isClosed = true"
      (opened)="isClosed = false"
      showingDisplay="flex"
    ></modal-outlet>
  </div>
</section>
