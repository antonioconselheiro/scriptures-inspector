<footer class="pinnedRowsFooter" aria-label="Pinned rows" [hidden]="!pinnedRows.count">
  <div class="pinnedRowsHeader">
    <button
      class="pinnedRowsClearButton"
      type="button"
      title="Unpin all rows"
      aria-label="Unpin all rows"
      (click)="pinnedRows.clear()"
    >
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
        <path d="M16 3H8v2l1 1v5l-3 3v2h5v6h2v-6h5v-2l-3-3V6l1-1V3z" fill="currentColor" />
        <path d="m5 5 14 14" fill="none" stroke="currentColor" stroke-width="2" />
      </svg>
    </button>
  </div>
  <div class="pinnedRowsViewport">
    <table border="1" frame="hsides" role="presentation">
      <tbody #rows></tbody>
    </table>
  </div>
</footer>
