<div class="modal">
  <h2>Novo Evento</h2>

  <label>Título</label>
  <input [(ngModel)]="modelo.titulo">

  <label>Dimensão</label>
  <select [(ngModel)]="modelo.dimensao">
    <option *ngFor="let d of dimensoes" [value]="d">{{ d }}</option>
  </select>

  <label>Data Hebraica Início</label>
  <input type="number" [(ngModel)]="modelo.dataInicio.dia" placeholder="Dia">
  <input type="number" [(ngModel)]="modelo.dataInicio.mes" placeholder="Mês">
  <input type="number" [(ngModel)]="modelo.dataInicio.ano" placeholder="Ano">

  <label>Data Hebraica Fim</label>
  <input type="number" [(ngModel)]="modelo.dataFim.dia" placeholder="Dia">
  <input type="number" [(ngModel)]="modelo.dataFim.mes" placeholder="Mês">
  <input type="number" [(ngModel)]="modelo.dataFim.ano" placeholder="Ano">

  <label>Referências (separadas por vírgula)</label>
  <input [(ngModel)]="modelo.referencias">

  <button (click)="submit()">Salvar</button>
  <button (click)="cancelar.emit()">Cancelar</button>
</div>
