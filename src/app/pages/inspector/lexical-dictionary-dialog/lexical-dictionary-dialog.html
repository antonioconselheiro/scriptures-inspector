<table border="1">

  <tr>
    <th>Word</th>
    <th>Lexical</th>
    <th></th>
  </tr>

  @for (lexical of lexicals; track $index) {
    <tr>
      <td>{{lexical.key}}</td>
      <td>{{lexical.value}}</td>
      <td><button type="button" (click)="deleteLexical(lexical.key)">×</button></td>
    </tr>
  }
</table>
