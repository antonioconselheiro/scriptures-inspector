<table border="1">

  <tr>
    <th>Translation Variants</th>
    <th></th>
  </tr>

  @for (variant of getVariations(); track $index) {
    <tr>
      <td><input type="text" [value]="variant.name"></td>
      <td><button type="button" (click)="deleteVariant(variant.key)">×</button></td>
    </tr>
  }
</table>
