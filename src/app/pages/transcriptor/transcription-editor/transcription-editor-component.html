<app-project-header (onProject)="onProjectChange($event)" (onCurrentArtifact)="onCurrentArtifactChange($event)"></app-project-header>

<form>
  <fieldset>
    <legend>Show</legend>
    <div>
      <label>Imagem Base</label>
      <input type="checkbox" />
    </div>

    <div>
      <label>Vector Editing</label>
      <input type="checkbox" />
    </div>

    <div>
      <label>Edit Transcript Positioning</label>
      <input type="checkbox" />
    </div>
  </fieldset>

  <fieldset>
    <button type="button" (click)="openDialogIncludeTranscription()">Include Transcription</button>
    <button type="button" (click)="openDialogDefineVector()">Define Vector</button>
  </fieldset>

  <fieldset>
    <img [src]="getImage()" />
  </fieldset>
</form>
