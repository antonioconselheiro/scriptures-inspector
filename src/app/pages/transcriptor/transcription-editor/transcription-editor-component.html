<app-project-header (onProject)="onProjectChange($event)"
  (onCurrentArtifact)="onCurrentArtifactChange($event)"></app-project-header>

<form [formGroup]="artifactForm" (ngSubmit)="onArtifactSubmit()">
  <fieldset>
    <legend>Define Artifact Properties</legend>

    <div>
      <label for="language">Language</label>

      <select id="language" formControlName="language">
        <option [ngValue]="null">Select...</option>

        @for (language of languageOptions; track language.value) {
        <option [value]="language.value">
          {{ language.name }}
        </option>
        }
      </select>

      @if (
        artifactForm.controls.language.invalid &&
        artifactForm.controls.language.touched
      ) {
        <small>Language is mandatory.</small>
      }
    </div>


    @if (hasSpellingOptions) {
    <div>
      <label for="spelling">Spelling</label>

      <select id="spelling" formControlName="spelling">
        <option [ngValue]="null">None</option>

        @for (spelling of spellingOptions; track spelling.label) {
        <option [value]="spelling.label">
          {{ spelling.name }}
        </option>
        }
      </select>
    </div>
    }
  </fieldset>

  <button type="submit">Define Metadata</button>
</form>

@if (artifact) {
  <div>
    <button type="button" (click)="openDialogIncludeTranscription(artifact)">
      Include Transcription
    </button>
    <button type="button" (click)="openDialogDefineVector(artifact)">
      Define Vector
    </button>
  </div>
}

<form>
  <fieldset>
    @if (artifact) {
      <legend>Edit Transcription Positioning</legend>

      <div>
        <strong>Show</strong>
        <label for="transcriptionEditorShowImage" class="button">
          <span>Imagem</span>
          <input
            type="checkbox"
            id="transcriptionEditorShowImage"
            #transcriptionEditorShowImage
            (change)="showImage = transcriptionEditorShowImage.checked"
          />
        </label>

        <label for="transcriptionEditorShowVector" class="button">
          <span>Vector</span>
          <input
            type="checkbox"
            id="transcriptionEditorShowVector"
            #transcriptionEditorShowVector
            (change)="showVector = transcriptionEditorShowVector.checked"
          />
        </label>

        <label for="transcriptionEditorShowTranscriptionPositioning" class="button">
          <span>Transcription Positioning</span>
          <input
            type="checkbox"
            id="transcriptionEditorShowTranscriptionPositioning"
            #transcriptionEditorShowTranscriptionPositioning
            (change)="showTranscriptionPositioning = transcriptionEditorShowTranscriptionPositioning.checked"
          />
        </label>
      </div>
    }

    <div class="graphicsWrapper">
      <img
        #imgPreview
        [src]="getImage()"
        alt="Fragment Image"
        [style.visibility]="showImage ? 'visible' : 'hidden'"
      />

      @if (artifact) {
        <div
          class="svgWrapper"
          [innerHTML]="artifact.vector"
          [style.visibility]="showVector ? 'visible' : 'hidden'"
        ></div>

        <div
          class="transcriptionPositioningWrapper"
          [style.visibility]="showTranscriptionPositioning ? 'visible' : 'hidden'"
        ></div>
      }
    </div>
  </fieldset>
</form>

<div>
  <button type="button" (click)="saveArtifactData()">
    Save
  </button>
</div>
