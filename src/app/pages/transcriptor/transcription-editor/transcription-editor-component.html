<app-project-header (onProject)="onProjectChange($event)" (onCurrentArtifact)="onCurrentArtifactChange($event)"></app-project-header>

<form>
  <fieldset>
    <legend>Show</legend>
    <div>
      <label>Imagem Base</label>
      <input type="checkbox" />
    </div>

    <div>
      <label>Vector Editing</label>
      <input type="checkbox" />
    </div>

    <div>
      <label>Edit Transcript Positioning</label>
      <input type="checkbox" />
    </div>
  </fieldset>

  <fieldset>
    <legend>Transcription</legend>
    <textarea placeholder="Transcription"></textarea>
  </fieldset>

  <fieldset>
    <img [src]="getImage()" />
  </fieldset>
</form>
