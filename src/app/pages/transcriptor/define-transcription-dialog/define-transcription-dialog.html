<form>
  <fieldset>
    <legend>Transcription</legend>
    <textarea [(ngModel)]="transcription" name="transcription" aria-label="Transcription text" placeholder="Transcription"></textarea>
  </fieldset>

  <button type="button" (click)="close()">Cancel</button>
  <button type="button" (click)="save()">Save</button>
</form>
