<h2>Define Vector</h2>
<div class="flex">
  <form [formGroup]="settingsForm">
    <aside>
      <h3>Filter</h3>
      <div>
        <label for="vectorBrightness">Brightness</label>
        <input id="vectorBrightness" type="range" formControlName="brightness" name="brightness" (change)="updateSVG()" value="1" min="0" max="2" step="0.1" data-type="--range-number">
      </div>
      <div>
        <label for="vectorContrast">Contrast</label>
        <input id="vectorContrast" type="range" formControlName="contrast" name="contrast" (change)="updateSVG()" value="1" min="0" max="10" step="0.1" data-type="--range-number">
      </div>
      <div>
        <label for="vectorBlur">Blur</label>
        <input id="vectorBlur" type="range" formControlName="blur" name="blur" (change)="updateSVG()" value="0" min="0" max="10" step="0.1" data-type="--range-number">
      </div>
      <div>
        <label><input type="checkbox" formControlName="invert" name="invert" (change)="updateSVG()">invert</label>
      </div>
      <div>
        <label class="button" for="checkboxShowImage">
          <span>Show Image</span>
          <input type="checkbox" id="checkboxShowImage" name="checkboxShowImage" formControlName="showImage" />
        </label>
        <label class="button" for="checkboxShowVector">
          <span>Show Vector</span>
          <input type="checkbox" id="checkboxShowVector" name="checkboxShowVector" formControlName="showVector" />
        </label>
      </div>
    </aside>
  </form>
  <div class="graphicsWrapper" [class.loading]="processingSVG">
    <img
      #imgPreview
      [src]="fragmentBase64"
      alt="Fragment Image"
      [style.visibility]="showImage ? 'visible' : 'hidden'"
      [style.filter]="imageFilterStyle"
    />

    <div
      class="svgWrapper"
      [innerHTML]="tracedSvgSafe"
      [style.visibility]="showVector ? 'visible' : 'hidden'"
    ></div>

    <app-artifact-text-editor text=""></app-artifact-text-editor>
  </div>
</div>

<div>
  <div class="dialogActions">
    <button type="button" (click)="cancel()">Cancel</button>
    <button type="button" (click)="save()">Save</button>
  </div>
</div>
