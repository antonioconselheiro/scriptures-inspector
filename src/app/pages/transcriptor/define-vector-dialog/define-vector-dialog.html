<div class="flex">
  <form [formGroup]="settingsForm">
    <aside>
      <h3>Filter</h3>
      <p>
        <label>Brightness</label>
        <input type="range" formControlName="brightness" name="brightness" (change)="updateSVG()" value="1" min="0" max="2" step="0.1" data-type="--range-number">
      </p>
      <p>
        <label>Contrast</label>
        <input type="range" formControlName="contrast" name="contrast" (change)="updateSVG()" value="1" min="0" max="10" step="0.1" data-type="--range-number">
      </p>
      <p>
        <label>Blur</label>
        <input type="range" formControlName="blur" name="blur" (change)="updateSVG()" value="0" min="0" max="10" step="0.1" data-type="--range-number">
      </p>
      <p>
        <label><input type="checkbox" formControlName="invert" name="invert" (change)="updateSVG()">invert</label>
      </p>
    </aside>
  </form>
  <div>
    <img
      #imgPreview
      [src]="fragmentImage"
      alt="Fragment Image"
      [style.filter]="imageFilterStyle"
    />

    <div [innerHTML]="tracedSvg"></div>
  </div>
</div>
