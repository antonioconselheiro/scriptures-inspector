<form>
  <h1>New Project</h1>

  <div>
    <label>Name</label>
    <input type="text" />
  </div>

  <div>
    <label>Destination</label>
    <input type="text" readonly />
    <button type="button">Choose</button>
  </div>

  <fieldset>
    <legend>Project Structure</legend>

    <div>
      <label>Name</label>
      <input type="text" />
    </div>

    <div>
      <label>Porpouse</label>
      <select>
        <optgroup label="Basic">
          <option value="translation-viewer">Reference Translation</option>
          <option value="metadata-editor">Metadata Editor</option>
        </optgroup>

        <optgroup label="Old Testament Codice">
          <option value="translation-editor">Interlinear Translation Relation</option>
          <option value="references-editor" disabled>Metadata Reference Relation</option>
          <option value="custom-translation">Custom Translation</option>
        </optgroup>
      </select>
    </div>

    <div>
      <label>Language</label>
      <select>
        <option></option>
      </select>
    </div>

    <button type="button">+ Porpouse</button>

    <table border="1">
      <thead>
        <tr>
          <th>Porpouse name</th>
        </tr>
        <tr>
          <th>Name</th>
          <th>kind</th>
        </tr>
      </thead>
      <tbody>
  
      </tbody>
    </table>
  </fieldset>

  <fieldset>
    <legend>Project Codices</legend>
    <div>
      <label>Codice name</label>
      <input placeholder="Codice name" type="text" />
    </div>

    <div>
      <label>Porpouse</label>
      <select>
        <option>list registred porpouses</option>
      </select>
    </div>

    <button type="button">+ Add</button>
  </fieldset>

  <fieldset>
    <legend>Codice books</legend>
  
    <table border="1">
      <thead>
        <tr rowspan="2">
          <th>Codice name</th>
        </tr>
        <tr>
          <th>Book</th>
          <th>Folder</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>GEN</td>
          <td>/etc/file/hebrew/gen.json</td>
        </tr>
      </tbody>
    </table>

    <button type="button">+ Book</button>
  </fieldset>

  <button type="submit">Create</button>
</form>
